name: Publish ORVIBO HACS v1.3.1

on:
  workflow_run:
    workflows:
      - Validate ORVIBO Cloud
    types:
      - completed

permissions:
  contents: write

jobs:
  publish:
    name: Publish after main validation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - name: Publish validated v1.3.1 release once
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$CURRENT_SHA" != "$VALIDATED_SHA" ]]; then
            echo "main advanced since validation; declining to publish stale code."
            exit 0
          fi
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/orvibo_cloud/manifest.json"))["version"])')"
          if [[ "$VERSION" != "1.3.1" ]]; then
            echo "Automatic publishing is intentionally limited to version 1.3.1."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$VALIDATED_SHA" \
            --title "ORVIBO Cloud v$VERSION" \
            --notes-file RELEASE_NOTES_1.3.1.md \
            --latest
