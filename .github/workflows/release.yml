name: Publish ORVIBO Cloud release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Validate tagged source and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release tag and manifest agree
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Only stable vX.Y.Z tags are publishable.' >&2
            exit 1
          }
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("custom_components/orvibo_cloud/manifest.json"))["version"])')"
          [[ "$VERSION" == "$MANIFEST_VERSION" ]] || {
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION" >&2
            exit 1
          }
          test -s "RELEASE_NOTES_${VERSION}.md"
      - name: Install release test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify package and unit/security regressions
        run: |
          python tools/check_repository.py
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components
      - name: Publish non-prerelease GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ORVIBO Cloud v$VERSION" \
            --notes-file "RELEASE_NOTES_${VERSION}.md" \
            --latest
