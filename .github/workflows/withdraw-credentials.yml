name: Withdraw legacy TLS credentials

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: orvibo-credential-withdrawal
  cancel-in-progress: false

jobs:
  withdraw:
    if: github.repository == 'Kosztyk/orvibo_cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install history cleanup tool
        run: python -m pip install git-filter-repo==2.47.0
      - name: Withdraw releases and publish verified cleaned history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/withdraw_legacy_credentials.py
